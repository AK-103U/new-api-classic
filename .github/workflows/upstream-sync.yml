name: Check and Sync Upstream

on:
  schedule:
    # 每天 UTC 20:00 (北京时间 04:00) 自动检查上游更新
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  check-and-sync:
    name: Check & Sync Upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_REPO: ${{ github.repository }}
      GOWORK: 'off'

    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Keep notification code from this workflow revision, not from the
      # candidate merge. A manual dispatch still synchronizes origin/main.
      - name: Preserve sync controller
        id: controller
        run: |
          mkdir -p "$RUNNER_TEMP/upstream-sync"
          cp .github/scripts/upstream_sync.py "$RUNNER_TEMP/upstream-sync/controller.py"

      - name: Fetch and merge upstream
        id: prepare
        run: python3 "$RUNNER_TEMP/upstream-sync/controller.py" prepare

      - name: Set up Go from merged module
        id: setup_go
        if: steps.prepare.outputs.merge_status == 'merged'
        continue-on-error: true
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Set up Bun from merged package
        id: setup_bun
        if: steps.prepare.outputs.merge_status == 'merged'
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Build Go modules independently
        id: backend
        if: steps.prepare.outputs.merge_status == 'merged' && steps.setup_go.outcome == 'success'
        continue-on-error: true
        run: python3 "$RUNNER_TEMP/upstream-sync/controller.py" build-backend

      - name: Install frontend and check types
        id: frontend
        if: steps.prepare.outputs.merge_status == 'merged' && steps.setup_bun.outcome == 'success'
        continue-on-error: true
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      - name: Publish synchronization branch
        id: push
        if: steps.prepare.outputs.merge_status == 'merged'
        continue-on-error: true
        env:
          PREVIOUS_REV: ${{ steps.prepare.outputs.previous_rev }}
          MERGED_REV: ${{ steps.prepare.outputs.merged_rev }}
        run: |
          # Do not overwrite a branch someone updated while the checks ran.
          git push --force-with-lease="refs/heads/upstream-sync:$PREVIOUS_REV" \
            origin "$MERGED_REV:refs/heads/upstream-sync"

      # continue-on-error above lets failed candidates get a diagnostic PR.
      # The controller reads outcome (not conclusion) and fails this final
      # step for conflicts, failed/skipped checks, push or notification errors.
      - name: Report synchronization result
        if: ${{ !cancelled() && steps.controller.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GO_SETUP_OUTCOME: ${{ steps.setup_go.outcome }}
          BUN_SETUP_OUTCOME: ${{ steps.setup_bun.outcome }}
          BACKEND_OUTCOME: ${{ steps.backend.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
        run: python3 "$RUNNER_TEMP/upstream-sync/controller.py" report
