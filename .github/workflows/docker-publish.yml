name: Build and Push Custom Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  resolve_version:
    name: Resolve version & tags
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.ver.outputs.app_version }}
      date_sha: ${{ steps.ver.outputs.date_sha }}
      short_sha: ${{ steps.ver.outputs.short_sha }}
      is_main: ${{ steps.ver.outputs.is_main }}
      is_tag: ${{ steps.ver.outputs.is_tag }}
      git_tag: ${{ steps.ver.outputs.git_tag }}
      image_name: ${{ steps.ver.outputs.image_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version metadata
        id: ver
        run: |
          # Docker 镜像名称必须全部小写
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d)
          DATE_SHA="main-${DATE}-${SHORT_SHA}"

          VER=$(tr -d ' \n\r' < VERSION 2>/dev/null || true)
          if [ -z "$VER" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              VER="${GITHUB_REF#refs/tags/}"
            else
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
              VER="${LATEST_TAG}-custom"
            fi
          fi

          echo "image_name=${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VER}"
          echo "app_version=${VER}" >> "$GITHUB_OUTPUT"
          echo "date_sha=${DATE_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "is_main=${{ github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"
          echo "is_tag=${{ startsWith(github.ref, 'refs/tags/v') }}" >> "$GITHUB_OUTPUT"
          echo "git_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    needs: [resolve_version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write resolved VERSION
        run: |
          echo "${{ needs.resolve_version.outputs.app_version }}" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.resolve_version.outputs.image_name }}:${{ needs.resolve_version.outputs.short_sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  create_manifest:
    name: Create multi-arch manifest
    needs: [resolve_version, build_single_arch]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and push multi-arch manifests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ needs.resolve_version.outputs.image_name }}"
          TAG_PREFIX="${IMAGE}:${{ needs.resolve_version.outputs.short_sha }}"
          SOURCES="${TAG_PREFIX}-amd64 ${TAG_PREFIX}-arm64"

          TARGET_TAGS=("-t" "${TAG_PREFIX}")

          if [ "${{ needs.resolve_version.outputs.is_main }}" = "true" ]; then
            TARGET_TAGS+=("-t" "${IMAGE}:latest")
            TARGET_TAGS+=("-t" "${IMAGE}:${{ needs.resolve_version.outputs.date_sha }}")
            TARGET_TAGS+=("-t" "${IMAGE}:${{ needs.resolve_version.outputs.app_version }}")
          fi

          if [ "${{ needs.resolve_version.outputs.is_tag }}" = "true" ]; then
            TAG_VER="${{ needs.resolve_version.outputs.git_tag }}"
            TARGET_TAGS+=("-t" "${IMAGE}:${TAG_VER}")
            TARGET_TAGS+=("-t" "${IMAGE}:latest")
          fi

          echo "Creating manifest with tags: ${TARGET_TAGS[*]}"
          docker buildx imagetools create "${TARGET_TAGS[@]}" ${SOURCES}
