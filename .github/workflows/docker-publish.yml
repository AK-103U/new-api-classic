name: Build and Push Custom Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  resolve_version:
    name: Resolve version & tags
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.ver.outputs.app_version }}
      revision: ${{ steps.ver.outputs.revision }}
      date_sha: ${{ steps.ver.outputs.date_sha }}
      short_sha: ${{ steps.ver.outputs.short_sha }}
      is_main: ${{ steps.ver.outputs.is_main }}
      is_tag: ${{ steps.ver.outputs.is_tag }}
      image_name: ${{ steps.ver.outputs.image_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compute version metadata
        id: ver
        run: python3 .github/scripts/docker_version.py

  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    needs: [resolve_version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Write resolved VERSION
        env:
          APP_VERSION: ${{ needs.resolve_version.outputs.app_version }}
        run: printf '%s\n' "$APP_VERSION" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.resolve_version.outputs.image_name }}:${{ needs.resolve_version.outputs.app_version }}-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ needs.resolve_version.outputs.image_name }}:${{ needs.resolve_version.outputs.short_sha }}-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ needs.resolve_version.outputs.image_name }}:build-${{ github.run_id }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve_version.outputs.app_version }}
            org.opencontainers.image.revision=${{ needs.resolve_version.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  create_manifest:
    name: Create multi-arch manifest
    needs: [resolve_version, build_single_arch]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble and push multi-arch manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ needs.resolve_version.outputs.image_name }}
          APP_VERSION: ${{ needs.resolve_version.outputs.app_version }}
          SHORT_SHA: ${{ needs.resolve_version.outputs.short_sha }}
          DATE_SHA: ${{ needs.resolve_version.outputs.date_sha }}
          IS_MAIN: ${{ needs.resolve_version.outputs.is_main }}
          IS_TAG: ${{ needs.resolve_version.outputs.is_tag }}
        run: |
          TARGET_TAGS=("-t" "${IMAGE}:${APP_VERSION}" "-t" "${IMAGE}:${SHORT_SHA}")
          if [ "$IS_MAIN" = "true" ]; then
            TARGET_TAGS+=("-t" "${IMAGE}:${DATE_SHA}")
          fi
          if [ "$IS_MAIN" = "true" ] || [ "$IS_TAG" = "true" ]; then
            TARGET_TAGS+=("-t" "${IMAGE}:latest")
          fi

          # Isolate concurrent main/tag builds of the same source commit.
          # Keep the run ID across attempts so retrying only a failed
          # architecture can reuse the successful architecture in this run.
          BUILD_PREFIX="${IMAGE}:build-${GITHUB_RUN_ID}"
          echo "Creating manifest with tags: ${TARGET_TAGS[*]}"
          docker buildx imagetools create "${TARGET_TAGS[@]}" \
            "${BUILD_PREFIX}-amd64" "${BUILD_PREFIX}-arm64"
