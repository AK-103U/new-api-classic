name: Build and Push Custom Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 获取完整历史以正确识别最新 tag 和版本号
          fetch-depth: 0

      - name: Resolve application version
        id: version
        run: |
          # 提取当前版本号并写入 VERSION 文件供 Docker 内前端/后端注入
          VER=$(tr -d ' \n\r' < VERSION 2>/dev/null || true)
          if [ -z "$VER" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              VER="${GITHUB_REF#refs/tags/}"
            else
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
              VER="${LATEST_TAG}-custom"
            fi
            echo "$VER" > VERSION
          fi
          echo "Resolved version: ${VER}"
          echo "app_version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            # 1. 语义化 Git Tag 发布：自动生成主次版本标签 (v1.0.0, v1.0, v1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

            # 2. main 分支日常集成：不可变的 日期 + 短 SHA (例: main-20261019-de34103，方便锁定与快速回滚)
            type=raw,value=main-{{date 'YYYYMMDD'}}-{{sha}},enable=${{ github.ref == 'refs/heads/main' }}

            # 3. 关联应用内部版本 (例: v1.0.0-rc.45-custom)
            type=raw,value=${{ steps.version.outputs.app_version }},enable=${{ github.ref == 'refs/heads/main' && steps.version.outputs.app_version != '' }}

            # 4. 短 Git SHA (例: sha-de34103)
            type=sha,format=short

            # 5. 便捷 latest 别名 (仅在 push 到 main 或打 tag 时标记)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
